<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
    <link rel="icon" href="#" />
		<title>Sandip</title>
    <meta name="description" content="Curious developer exploring different areas of programming">
    <meta name="viewport" content="width=device-width, initial-scale=1" viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://github.com https://avatars.githubusercontent.com https://github-production-user-asset-6210df.s3.amazonaws.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <link rel="preload" href="./projects.json" as="fetch" crossorigin="anonymous">
    <meta name="theme-color" content="hsl(0, 0%, 5%)">
		<link rel="stylesheet" href="/main.css">
		<script defer src="/app.js"></script>
	</head>
	<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Praise the Fool...</p>
    </div>
    <!-- NAVBAR -->
    <div class="navbar">
      <a class="nav-title-link" href="./index.html">
        <span class="nav-title">ST</span>
      </a>
      <a class="button" href="mailto:sandip_tamang@proton.me">
        <span class="button-text">Contact Me</span>
      </a>
    </div>

    <!-- MAIN PAGE CONTENT -->
    <main id="main-content">

      <!-- PORTFOLIO HEADER -->
      <section id="portfolio-header">
        <div id="portfolio-header-image-container">
          <img src="" width="400" height="400" class="portfolio-header-image" alt="arcanesandip" fetchpriority="high" loading="eager">
        </div>
        <div id="portfolio-header-text-container">
            <div class="header-text">
              <span class="main-title">Hey, I'm @arcanesandip.</span>
              <div class="body-text">Curious developer exploring different areas of programming by building small projects and learning along the way.</div>
            </div>
            <a class="button" href="#my-projects">
              <span class="button-text">Check out my projects</span> 
              <img src="/arrow-right.svg" alt="right-arrow-icon" class="right-arrow-icon"/>
            </a>
        </div>
      </section>

      <section id="my-projects">
          <h2>Featured Projects</h2>
          <div id="repo-list"></div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer id="footer">

      <a class="icon-link" target="_blank" href="https://github.com/arcanesandip">
        <img class="footer-icon" src="/github.svg" alt="github">
      </a>

      <a class="icon-link" href="https://x.com/arcanesandip">
        <img class="footer-icon" src="/x.svg" alt="X">
      </a>

      <a class="icon-link" target="_blank" href="https://medium.com/@arcanesandip">
        <img class="footer-icon" src="/medium.svg" alt="medium">
      </a>
    </footer>
    <script>
      window.addEventListener('load', () => {
          const loader = document.getElementById('loader');
          // Add a slight delay so the "distraction" actually works
          setTimeout(() => {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 500);
          }, 1000); 
      });
    </script>
	</body>
</html>

name: Update Project Data
on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    permissions:
      contents: write   
      pages: write      
      id-token: write   
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install -r builder/requirements.txt 
        
      - name: Run scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python builder/scanner.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add files only if they exist to avoid 'pathspec' errors
          git add projects.json
          [ -f "public/assets/profile.webp" ] && git add public/assets/profile.webp
          # Use find to safely add webp files if they exist
          find public/assets/project-thumbs -name "*.webp" -exec git add {} +
          
          # Check if there are actually changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit, exiting."
            exit 0
          fi
          
          git commit -m "Auto-update projects and thumbnails"
          git pull origin main --rebase
          git push origin main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="./public/assets/favicon_io/site.webmanifest">
    <meta property="og:title" content="Sandip | Portfolio">
    <meta property="og:description" content="Curious developer exploring different areas of programming.">
    <meta property="og:image" content="https://arcanesandip.github.io/public/assets/favicon_io/android-chrome-512x512.png">
    <meta property="og:url" content="https://arcanesandip.github.io/">
    <meta property="og:type" content="website">
    <title>Sandip | Portfolio</title>
    <meta name="description" content="Curious developer exploring different areas of programming">
    <meta name="viewport" content="width=device-width, initial-scale=1" viewport-fit="cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://formspree.io; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; manifest-src 'self'; object-src 'none'; base-uri 'self';">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="public/css/main.css">
    <script type="module" defer src="public/js/app.js"></script>
  </head>
  <body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Praise the Fool...</p>
    </div>

    <nav class="navbar">
      <div class="nav-container">
        <a class="nav-title-link" href="./index.html">
          <span class="nav-title" data-text="ST">ST</span>
        </a>
        <a class="button floating-element" id="nav-contact-btn" href="mailto:sandip_tamang@proton.me">
          <span class="button-text">Contact Me</span>
        </a>
      </div>
    </nav>

    <main id="main-content">

      <section id="portfolio-header">
        <div id="portfolio-header-image-container" class="floating-element">
          <img src="./public/assets/profile.webp" class="portfolio-header-image" alt="arcanesandip" loading="eager">
        </div>
        
        <div id="portfolio-header-text-container">
            <div class="header-text">
              <span class="main-title">Hey, I'm @arcanesandip.</span>
              <div class="body-text">
                Curious developer exploring different areas of programming by building small projects and learning along the way.
              </div>
            </div>
            
            <a class="button floating-element" id="header-cta-btn" href="#my-projects">
              <span class="button-text">Check out my projects</span> 
              <img src="./public/assets/icons/arrow-right.svg" alt="right-arrow-icon" class="right-arrow-icon"/>
            </a>
        </div>
      </section>

      <section id="my-projects">
          <h2>Featured Projects</h2>
          <div id="repo-list"></div>
      </section>

    </main>

    <!-- Contact Form Popup Modal Container -->
    <div id="contact-modal" class="modal-overlay" inert role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
      <div class="modal-content" tabindex="-1">
        <!-- Close Button -->
        <button id="close-modal-btn" class="close-btn" aria-label="Close modal">&times;</button>
        
        <h3 id="contact-modal-title" class="modal-title">Send a Message</h3>
        <p class="modal-subtitle">Got a question or want to collaborate? Drop it below.</p>
        
        <!-- Contact Form -->
        <form id="contact-form" action="https://formspree.io/f/mlgvbdzg" method="POST" autocomplete="off">
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" required />
          </div>

          <div class="form-group">
            <label for="contact-email">Email Address</label>
            <input type="email" id="contact-email" name="email" placeholder="name@domain.com" required />
          </div>

          <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
          </div>

          <button type="submit" class="button form-submit-btn">
            <span class="button-text">Send Message</span>
          </button>
        </form>
      </div>
    </div>

    <footer id="footer">
      <a class="icon-link" target="_blank" href="https://github.com/arcanesandip">
        <img class="footer-icon" src="./public/assets/icons/github.svg" alt="github">
      </a>
      <a class="icon-link" target="_blank" href="https://x.com/arcanesandip">
        <img class="footer-icon" src="./public/assets/icons/x.svg" alt="X">
      </a>
      <a class="icon-link" target="_blank" href="https://medium.com/@arcanesandip">
        <img class="footer-icon" src="./public/assets/icons/medium.svg" alt="medium">
      </a>
    </footer>

    <script>
      window.addEventListener('load', () => {
          const loader = document.getElementById('loader');
          setTimeout(() => {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 500);
          }, 1000); 
      });
    </script>
  </body>
</html>

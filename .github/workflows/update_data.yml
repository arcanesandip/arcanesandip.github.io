name: Update Project Data
on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight
  workflow_dispatch: # Allows you to run it manually with a button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial: explicitly gives the token write access
    steps:
      - uses: actions/checkout@v4 # Updated to v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        # Direct install is safer unless you actually have a requirements.txt
        run: pip install requests 
        
      - name: Run scanner
        run: python scanner.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects.json
          # The "|| exit 0" prevents the action from failing if there are no changes
          git commit -m "Auto-update projects.json" || exit 0
          git push
